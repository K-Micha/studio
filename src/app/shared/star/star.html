<div class="stars" role="img" [attr.aria-label]="rating() + ' out of 5 stars'">
    <div class="stars__base" aria-hidden="true">
        @for (star of stars; track star) {
        <svg viewBox="0 0 24 24" class="stars__icon">
            <path
                d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" />
        </svg>
        }
    </div>

    <div class="stars__fill" [style.width.%]="percentage()" aria-hidden="true">
        <div class="stars__base stars__base--gold">
            @for (star of stars; track star) {
            <span class="stars__icon stars__icon--gold"></span>
            }
        </div>
    </div>
</div>
